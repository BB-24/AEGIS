version: 2
builds:
  - id: aegis-operator
    main: ./cmd/aegis-operator
    binary: aegis-operator
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: aegis-worker
    main: ./cmd/aegis-worker
    binary: aegis-worker
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: aegis-metadata
    main: ./cmd/aegis-metadata
    binary: aegis-metadata
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: aegis-storage
    main: ./cmd/aegis-storage
    binary: aegis-storage
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: aegis-cli
    main: ./cmd/aegis-cli
    binary: aegis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
