version: v2
managed:
  enabled: true
  go_package_prefix:
    default: github.com/aegis/aegis/pkg/proto/generated
    except:
      - buf.build/googleapis/googleapis
      - buf.build/grpc-ecosystem/grpc-gateway
      - buf.build/kubernetes-io/kubernetes
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
      file: google/api/annotations.proto

plugins:
  - remote: buf.build/protocolbuffers/go:v1.35.2
    out: pkg/proto/generated
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: pkg/proto/generated
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/grpc-gateway:v2.24.0
    out: pkg/proto/generated
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.24.0
    out: docs/api/openapi
    opt:
      - logtostderr=true
